[project]
name = "churnops"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Eike Christoph Ullrich", email = "eikeullrich@outlook.de" }
]
requires-python = ">=3.13"
dependencies = [
]

[project.scripts]
churnops = "churnops:main"

[build-system]
requires = ["uv_build>=0.12.12,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "dvc[s3]>=3.67.1",
    "kagglehub>=1.0.2",
    "mypy>=2.3.1",
    "pandas>=3.0.5",
    "pandera>=0.33.1",
    "pyarrow>=25.0.1",
    "pre-commit>=4.6.2",
    "pandas-stubs>=3.0.5.260730",
    "matplotlib>=3.11.1",
    "scikit-learn>=1.9.1",
    "umap-learn>=0.5.12",
]

[tool.mypy]
ignore_missing_imports = true
